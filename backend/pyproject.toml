[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-backend"
version = "0.1.0"
description = "DocMind 后端 —— W5 文档摄取管线（解析 / 清洗 / 分块 / 状态 / 重试）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "tiktoken>=0.7",
  "pypdf>=4.2",
  "python-docx>=1.1",
  # 鉴权（ADR-0002，任务 3.1/3.2）：凭证签发用 PyJWT，密码哈希用 argon2id。
  # 依赖只在这里声明（无 requirements.txt / lockfile），镜像走 `pip install .`
  # —— 只装本地 venv 不会进镜像。
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  # 上传接口的 multipart/form-data 解析（任务 5.1）。
  # FastAPI 的 UploadFile / File() / Form() 必须有它才可用，缺了会在路由注册期直接抛错。
  # 下界 0.0.9 落在 CVE-2024-53981（分段拒绝服务）修复版之后。决策见 docs/adr/0003。
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 测试脚手架（任务 1.5）
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 事件循环必须是 session 级：`db_engine` 是 session 作用域的异步 fixture，若各用例
# 各用一个函数级循环，连接池里的连接会跨循环使用 → Windows 上表现为
# `AttributeError: 'NoneType' object has no attribute 'send'`（Proactor 循环已关闭），
# 而 check_database 会把它吞成"测试库不可达"并 skip（2026-09-12 实测踩到，见 findings D-027）。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
# -ra：强制在汇总里列出 skip。跳过 ≠ 通过，必须一眼看得见。
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
