[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-backend"
version = "0.1.0"
description = "DocMind 后端 —— W5 文档摄取管线（解析 / 清洗 / 分块 / 状态 / 重试）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "tiktoken>=0.7",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# 测试脚手架（任务 1.5）
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
