# DocMind 运行环境（任务 1.3）
#
# 端口约束（本机实测冲突）：宿主 8000 / 5432 / 6379 已被既有 OneHub 栈占用，
# 9000-9001 / 9091 / 19530 被既有 Milvus 占用。故本文件使用独立 project name
# `docmind`，pg / redis / nginx 分别映射到 5433 / 6380 / 8080，api 容器内端口不暴露到宿主。
#
# Milvus 系列列在 `milvus` profile 下，本期默认不启动：
#   docker compose up -d                          # 不含 Milvus
#   docker compose --profile milvus up -d         # 需要时再启

name: docmind

x-app-env: &app-env
  # 容器内用服务名互访；宿主侧直连走 .env 里的 127.0.0.1:5433 / 6380
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docmind}:${POSTGRES_PASSWORD:-docmind}@pg:5432/${POSTGRES_DB:-docmind}
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /data/uploads
  APP_ENV: ${APP_ENV:-dev}

x-app-base: &app-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: docmind-backend:local
  env_file:
    - .env
  environment:
    <<: *app-env
  volumes:
    - uploads:/data/uploads
  depends_on:
    pg:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  pg:
    image: postgres:16-alpine
    container_name: docmind-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docmind} -d ${POSTGRES_DB:-docmind}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *app-base
    container_name: docmind-api
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *app-base
    container_name: docmind-worker
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --timeout 5 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  beat:
    <<: *app-base
    container_name: docmind-beat
    command:
      ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      # beat 无内置健康端点：用「beat 心跳任务写进 Redis 的键是否还在」做真探针，
      # 该键由 beat 触发、worker 执行写回，实际覆盖 beat → broker → worker → redis 整条链路
      test:
        ["CMD-SHELL", "python -c 'import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ[\"REDIS_URL\"]).exists(\"docmind:beat:heartbeat\") else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    container_name: docmind-nginx
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: docmind-milvus-etcd
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvusetcd:/etcd
    command:
      ["etcd", "-advertise-client-urls=http://127.0.0.1:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir", "/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: docmind-milvus-minio
    profiles: ["milvus"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "${MILVUS_MINIO_API_PORT:-9002}:9000"
      - "${MILVUS_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - milvusminio:/minio_data
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: docmind-milvus-standalone
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19531}:19530"
      - "${MILVUS_METRICS_PORT:-9092}:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  uploads:
  milvusetcd:
  milvusminio:
  milvusdata:
